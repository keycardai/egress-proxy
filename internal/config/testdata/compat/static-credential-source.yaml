# A document with a static credential source: no identity, one endpoint per
# placement this build writes, and one endpoint without a credential.
version: 1
sandbox:
  id: "sbx-static"
credentials:
  static_file: "/run/egress/credentials.yaml"
endpoints:
  - host: "api.github.com"
    resource: "https://api.github.com/"
    credential:
      placement: {kind: header, name: Authorization, template: "Bearer {credential}"}
      env: GITHUB_TOKEN
  - host: "maps.example"
    resource: "https://maps.example/"
    credential:
      placement: {kind: query, name: key}
      env: MAPS_API_KEY
  - host: "pypi.org"
