# The lint gate. golangci-lint is a tool directive in go.mod, which pins its
# version; scripts/lint.sh runs it and CI runs that same script.

version: "2"

run:
  tests: true
  # Report every path relative to the go.mod of the module being linted, so
  # a path in an exclusion rule below means the same thing wherever the
  # checkout lives. The default is relative to this file's directory, which
  # puts a fixture module outside the repository behind a long ../ prefix.
  relative-path-mode: gomod

linters:
  default: all
  disable:
    - exhaustruct
    - exhaustruct_v5
    - godox
    - gomodguard
    - nlreturn
    - noinlineerr
    - tagliatelle
    - wsl
    - wsl_v5
  settings:
    gomoddirectives:
      # A replace to a directory is allowed; the gate fixtures use one to
      # stand in an internal module. A replace to another module path is not.
      replace-local: true
    depguard:
      rules:
        # This repository ships to customers and may depend only on public
        # modules. NEVER import github.com/keycardlabs/; the public SDKs live
        # under github.com/keycardai/.
        no-internal-keycard-modules:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/keycardlabs/
              desc: internal Keycard modules cannot ship in this repository; use the public github.com/keycardai/ modules
        # Fixtures under test/ mint credentials and answer as an authorization
        # server. NEVER import one from cmd/ or internal/, which would put it
        # in a shipped binary.
        #
        # depguard matches a files glob against the absolute path, so NEVER
        # name a directory of the tree in one: the glob would then read the
        # path the repository is checked out under. The exemption for files
        # under test/ is an exclusion rule below, on the module-relative
        # path.
        no-test-fixtures-in-shipped-code:
          list-mode: lax
          files:
            - "!$test"
          deny:
            - pkg: github.com/keycardai/egress-proxy/test/
              desc: test fixtures never ship; import them from a _test.go file only
    errcheck:
      # A failed write to stdout or stderr has nowhere to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true
      disable:
        # Struct field order is chosen for readability, not for padding.
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    varnamelen:
      min-name-length: 3
      ignore-names:
        - i
        - j
        - k
        - ok
        - err
        - w
        - r
        - tc
        - tt
  exclusions:
    generated: lax
    rules:
      # These are build-tagged tests, where fixtures are appropriate.
      - path: ^test/
        linters:
          - depguard
        text: no-test-fixtures-in-shipped-code
      # A test reads and writes paths it built itself, so the file-inclusion,
      # file-permission and subprocess rules have nothing to say about it.
      - path: _test\.go
        linters:
          - gosec
        text: (G204|G304|G306)
      # A table test repeats fixture strings and branches once per
      # assertion, so the constant and complexity rules have nothing to say
      # about it.
      - path: _test\.go
        linters: [funlen, varnamelen, cyclop, goconst]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - golines
  settings:
    # Imports are three blank-line-separated groups in this order: standard
    # library, third-party, this module. Each group is sorted.
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - localmodule
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    gofumpt:
      module-path: github.com/keycardai/egress-proxy
      extra:
        group-params: true
        balance-calls: true
    golines:
      max-len: 120
      tab-len: 2
