# Every job here runs a Makefile target, so the local gate and the CI gate
# are one gate. Each action pin names a commit, and Dependabot moves the
# pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release job dispatches this workflow on the release PR branch.
  workflow_dispatch:

# A push to main is never cancelled, so every commit on main runs the
# release job. Anything else gives way to a newer run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make build
      # The gate self-tests under test/gates run the gate scripts against
      # their negative fixtures, so this job builds the tools too.
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make lint

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check-licenses
      - run: make check-notice
      - run: make vuln
      # go.mod must stay tidy so the tool pins in it are the pins in use.
      - run: make tidy && git diff --exit-code -- go.mod go.sum

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Ensure all kernel modules needed for network intercepts are loaded.
      - run: sudo modprobe -a iptable_filter iptable_nat ip6table_filter ip6table_nat
      - run: make acceptance

  # The three images, built locally. Nothing here pushes: the release job
  # publishes.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Ensure all kernel modules needed for network intercepts are loaded.
      - run: sudo modprobe -a iptable_filter iptable_nat ip6table_filter ip6table_nat
      - run: make images

  # Test the egress-proxy in a k3d cluster. This builds the images, creates a
  # k3d cluster, imports them and drives a request from inside the agent
  # container.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: install k3d
        env:
          K3D_VERSION: v5.9.0
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
        run: |
          curl -fsSL -o k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install -m 0755 k3d /usr/local/bin/k3d
          rm k3d
          k3d version
      # Ensure all kernel modules needed by netsetup are loaded.
      - run: sudo modprobe -a iptable_filter iptable_nat ip6table_filter ip6table_nat
      - run: make e2e E2E_FLAGS=-v

  # The release PR, and on a release the tag and the published images. It
  # runs only after every gate above has passed on a push to main.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, lint, checks, acceptance, images, e2e]
    # One release run at a time, so two pushes never race release-please or
    # the `main` tag.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
