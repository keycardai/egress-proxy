<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="564" viewBox="0 0 1000 564" role="img" aria-labelledby="title desc">
  <title id="title">egress-proxy architecture</title>
  <desc id="desc">The agent sends a request to api.github.com with a placeholder token. The egress-proxy sidecar checks its endpoint list, exchanges the pod's identity at the Keycard zone for a GitHub token, replaces the placeholder with that token, and forwards the request to GitHub.</desc>
  <defs>
    <marker id="lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#bdee63"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#777b84"/>
    </marker>
    <style>
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .title { font-size: 15px; font-weight: 600; fill: #edeef0; }
      .sub { font-size: 12px; fill: #b0b4ba; }
      .label { font-size: 13px; font-weight: 600; }
      .step { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="564" rx="16" fill="#111113"/>

  <!-- Keycard zone -->
  <rect x="330" y="24" width="344" height="122" rx="12" fill="#171625" stroke="#3d3e82"/>
  <text class="sans label" x="350" y="50" fill="#b1a9ff">Keycard zone</text>
  <text class="sans sub" x="350" y="68">Issues credentials by policy</text>
  <rect x="350" y="84" width="304" height="40" rx="6" fill="#212225"/>
  <text class="mono" x="366" y="109" fill="#edeef0">github</text>
  <text class="mono" x="430" y="109" fill="#bde56c">gho_••••</text>

  <!-- Sandbox pod -->
  <rect x="24" y="200" width="620" height="340" rx="12" fill="#18191b" stroke="#363a3f"/>
  <text class="sans label" x="44" y="226" fill="#edeef0">Sandbox pod</text>
  <text class="sans sub" x="44" y="244">Runs the agent without secrets.</text>

  <!-- Internet -->
  <rect x="676" y="200" width="300" height="340" rx="12" fill="none" stroke="#43484e" stroke-dasharray="6 5"/>
  <text class="sans label" x="696" y="226" fill="#edeef0">Internet</text>
  <text class="sans sub" x="696" y="244">Third-party APIs</text>

  <!-- Agent -->
  <rect x="56" y="270" width="220" height="80" rx="8" fill="#212225" stroke="#43484e"/>
  <text class="sans title" x="76" y="304">Agent</text>
  <text class="sans sub" x="76" y="324">Untrusted workload</text>

  <!-- egress-proxy -->
  <rect x="392" y="270" width="220" height="112" rx="8" fill="#212225" stroke="#577538" stroke-width="1.5"/>
  <text class="sans title" x="412" y="304">egress-proxy</text>
  <text class="sans sub" x="412" y="324">Sidecar in the same pod</text>
  <rect x="412" y="340" width="180" height="26" rx="4" fill="#1f2917"/>
  <text class="mono" x="422" y="358" fill="#edeef0" style="font-size:12px">api.github.com</text>
  <text class="sans" x="580" y="358" fill="#bdee63" text-anchor="end" style="font-size:12px">allowed</text>

  <!-- GitHub -->
  <rect x="708" y="270" width="236" height="80" rx="8" fill="#212225" stroke="#43484e"/>
  <text class="sans title" x="728" y="304">GitHub</text>
  <text class="mono" x="728" y="325" fill="#b0b4ba" style="font-size:12px">api.github.com</text>

  <!-- 1: agent to proxy -->
  <path d="M278 310 H388" stroke="#777b84" stroke-width="2" fill="none" marker-end="url(#gray)"/>
  <circle cx="333" cy="290" r="11" fill="#edeef0"/>
  <text class="sans step" x="333" y="294" fill="#111113" text-anchor="middle">1</text>

  <!-- 2: endpoint list -->
  <circle cx="612" cy="353" r="11" fill="#edeef0"/>
  <text class="sans step" x="612" y="357" fill="#111113" text-anchor="middle">2</text>

  <!-- 3: token exchange -->
  <path d="M502 150 V266" stroke="#bdee63" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-start="url(#lime)" marker-end="url(#lime)"/>
  <circle cx="530" cy="176" r="11" fill="#bdee63"/>
  <text class="sans step" x="530" y="180" fill="#1c2024" text-anchor="middle">3</text>
  <text class="sans" x="550" y="181" fill="#edeef0" style="font-size:13px">Token exchange</text>

  <!-- 4: proxy to GitHub -->
  <path d="M614 310 H704" stroke="#bdee63" stroke-width="2" fill="none" marker-end="url(#lime)"/>
  <circle cx="660" cy="290" r="11" fill="#bdee63"/>
  <text class="sans step" x="660" y="294" fill="#1c2024" text-anchor="middle">4</text>

  <!-- What the agent sends -->
  <text class="sans sub" x="56" y="420">The agent sends</text>
  <rect x="56" y="432" width="300" height="96" rx="8" fill="#111113" stroke="#363a3f"/>
  <text class="mono" x="72" y="460" fill="#b0b4ba">GET /user HTTP/1.1</text>
  <text class="mono" x="72" y="484" fill="#b0b4ba">Host: api.github.com</text>
  <text class="mono" x="72" y="508" fill="#edeef0">Authorization: Bearer <tspan fill="#ff9592" text-decoration="line-through">placeholder</tspan></text>

  <!-- Replacement arrow -->
  <path d="M362 484 H686" stroke="#bdee63" stroke-width="2" fill="none" marker-end="url(#lime)"/>
  <text class="sans" x="524" y="472" fill="#edeef0" text-anchor="middle" style="font-size:13px">The proxy replaces the placeholder</text>

  <!-- What GitHub receives -->
  <text class="sans sub" x="692" y="420">GitHub receives</text>
  <rect x="692" y="432" width="268" height="96" rx="8" fill="#111113" stroke="#577538"/>
  <text class="mono" x="708" y="460" fill="#b0b4ba">GET /user HTTP/1.1</text>
  <text class="mono" x="708" y="484" fill="#b0b4ba">Host: api.github.com</text>
  <text class="mono" x="708" y="508" fill="#edeef0">Authorization: Bearer <tspan fill="#bdee63">gho_••••</tspan></text>
</svg>
