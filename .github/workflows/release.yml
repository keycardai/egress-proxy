# The release, called by ci.yml once every gate has passed on a push to
# main. Every action pin names a commit, and Dependabot moves the pins.
#
# release-please keeps one release PR open with the version and changelog
# the conventional commits since the last release call for. Merging that PR
# tags the release and creates the GitHub release. The tag is pushed with
# the workflow token, which starts no workflow, so the images for a release
# are published here rather than by a tag trigger.
#
# Every push to main publishes the three images under the `main` tag. A
# release adds its version tag to the same build.
#
# NEVER publish or sign any commit but github.sha, the commit whose gates
# passed in this run. Only the run for the release PR's merge commit creates
# the release. If that run fails or is cancelled, re-run it. Until it
# passes, release-please does not update the release PR. If the release
# commit guard in publish ever fails, the tag and the GitHub release exist
# without images, and the images must be published by hand.
name: release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Decides whether this run may create the release. It may only when
  # github.sha is the merge commit of a merged release PR. release-please
  # marks that PR with the `label` in its config, `autorelease: pending` by
  # default, and tags the PR's merge commit. This job's token cannot write.
  release-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: check for a release merge commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/release-please-config.json?ref=$GITHUB_SHA")"
          labels="$(jq -c '(.label // "autorelease: pending") | split(",")' <<<"$config")"
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq --arg sha "$GITHUB_SHA" --arg base "$GITHUB_REF_NAME" --argjson want "$labels" \
              '[.[] | select(.merge_commit_sha == $sha and .merged_at != null and .base.ref == $base)
                    | select($want - [.labels[].name] == [])] | length')"
          if [ "$count" -gt 0 ]; then
            echo "$GITHUB_SHA is a release PR merge commit"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          # A merged release PR that still has the labels is not released.
          # Its own run is in progress, failed, or was cancelled.
          gh pr list --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --state merged \
              --label "$(jq -r '.[0]' <<<"$labels")" --json number,mergeCommit,labels |
            jq -r --argjson want "$labels" \
              '.[] | select($want - [.labels[].name] == []) | "\(.number) \(.mergeCommit.oid)"' |
            while read -r pr sha; do
              msg="Release PR #$pr merged as $sha is not released. If the ci run for $sha failed or was cancelled, re-run it."
              echo "::warning::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            done ||
            echo "::warning::Could not list merged release PRs."

  release-please:
    needs: release-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To dispatch ci.yml on the release PR branch.
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Any value but `false` skips the release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ needs.release-commit.outputs.skip != 'false' }}
      # A PR the workflow token opens or updates starts no pull_request
      # workflow, so the gates are dispatched on its branch. The checks land
      # on the PR's head commit. release-please sets `pr` only when it opens
      # or changes the PR, so `pr` is parsed in the script, where an empty
      # value never reaches fromJSON.
      - name: run the gates on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r .headBranchName <<<"$PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      # To upload the digests to the GitHub release.
      contents: write
      packages: write
      # The OIDC token cosign signs with.
      id-token: write
    env:
      RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # A release that tags any commit but github.sha stops the job before
      # it logs in or pushes.
      - name: check the release commit
        id: release-commit-guard
        if: env.RELEASE_CREATED == 'true'
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::release $TAG_NAME tags $RELEASE_SHA, but the gates passed on $GITHUB_SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Emulation for the arm64 RUN steps in the Debian images.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # A docker-container builder, which multi-platform builds, SBOMs and
      # provenance attestations need.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: publish
        run: |
          tags=main
          if [ "$RELEASE_CREATED" = "true" ]; then
            tags="$tags $TAG_NAME"
          fi
          make publish PUBLISH_TAGS="$tags" IMAGE_REVISION="$(git rev-parse HEAD)"
      - run: make sign
      - name: record the digests
        run: |
          {
            echo '### Published images'
            echo '```'
            cat dist/publish/digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: attach the digests to the release
        if: env.RELEASE_CREATED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" dist/publish/digests.txt --repo "$GITHUB_REPOSITORY"
