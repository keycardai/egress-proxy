# A document whose exchange authenticates with a client secret instead of
# the projected workload token. It serves a zone reached from outside
# Kubernetes, where no OIDC issuer signs a ServiceAccount token.
version: 1
sandbox:
  id: "sbx-client-secret"
identity:
  zone_url: "https://acme.keycard.cloud"
  client_id: "app-cred-1"
  client_secret_file: "/run/secrets/keycard/client-secret"
  impersonate:
    user: "igmua2g0fwapl21qll7tczdw7t"
limits:
  exchange_timeout: "15s"
endpoints:
  - url: "https://api.github.com/"
    credential:
      placement: {kind: header, name: Authorization, template: "Bearer {credential}"}
  - url: "https://pypi.org/"
