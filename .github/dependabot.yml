# Dependency updates as PRs. Each PR runs the same gates as any other change,
# so a license or vulnerability regression in an update fails CI.
#
# Dependabot scans only the directories listed here. The fixture modules
# under test/gates/testdata pin old or copyleft versions on purpose, so this
# file leaves them out. Dependabot does not move the `go` directive. Bump the
# Go toolchain by hand in go.mod.
version: 2
updates:
  # Covers the dependencies and the tool directives alike.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
  # The base images in literal FROM lines. images/proxy/.ko.yaml is not
  # read, so its digest is bumped by hand.
  - package-ecosystem: "docker"
    directories:
      - "/images/netsetup"
      - "/images/proxy"
      - "/images/sandbox-base"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      base-images:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
