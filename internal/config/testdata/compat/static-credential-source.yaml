# A document with a static credential source: no identity, one endpoint with
# a header placement, one with a query placement, and one endpoint without a
# credential.
version: 1
sandbox:
  id: "sbx-static"
credentials:
  static_file: "/run/egress/credentials.yaml"
endpoints:
  - url: "https://api.github.com/"
    credential:
      placement: {kind: header, name: Authorization, template: "Bearer {credential}"}
  - url: "https://maps.example/"
    credential:
      placement: {kind: query, name: key}
  - url: "https://pypi.org/"
